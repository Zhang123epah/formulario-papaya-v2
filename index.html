<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Candidatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <img class="logo" src="assets/logo-papaya.jpeg" alt="Papaya Management Scouter">

  <h1>Candidatura para Modelo</h1>
  <p class="intro">Preenche os teus dados e envia algumas fotografias para análise da candidatura.</p>

    <form id="formulario">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" autocomplete="name" required>

      <label for="idade">Idade:</label>
      <input   type="text" id="idade" name="idade" inputmode="numeric" pattern="[0-9]*" maxlength="3" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" autocomplete="tel"required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="altura">Altura:</label>
      <input type="text" id="altura" name="altura" placeholder="Ex: 170cm" required>

      <label for="fotos">Fotos:</label>
      <input type="file" id="fotos" name="fotos" accept="image/*" multiple required>
      <small>Podes enviar mais do que uma fotografia.</small>

      <div class="rgpd">
        <input type="checkbox" id="rgpd" name="rgpd" required>
        <span>
          Autorizo o tratamento dos meus dados pessoais, nos termos do RGPD, para efeitos de análise da minha candidatura a modelo.
        </span>
      </div>

      <button type="submit">Enviar candidatura</button>
    </form>

    <p id="estado" aria-live="polite"></p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
